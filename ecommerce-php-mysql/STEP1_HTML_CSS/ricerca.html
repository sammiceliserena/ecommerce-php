<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricerca – SereCosmetics❀</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">SereCosmetics❀</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door" style="font-size:1.5rem;"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="login.html"><i class="bi bi-person-circle" style="font-size:1.5rem;"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="carrello.html"><i class="bi bi-cart" style="font-size:1.5rem;"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="cronologia-ordini.html"><i class="bi bi-bag-check" style="font-size:1.5rem;"></i></a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <section class="container my-4">
    <h1 class="h3 mb-3">Risultati ricerca</h1>
    <p id="search-query" class="text-muted"></p>
    <div class="row g-3" id="products-container">
      <!-- Prodotti caricati -->
    </div>
  </section>
</main>
  
<footer class="mt-5 py-4">
  <div class="container d-flex justify-content-between flex-wrap gap-3">
    <div>© 2025 SereCosmetics❀</div>
  </div>
</footer>

<script>
// Elenco prodotti disponibili
const products = [
  { name: "Lip Gloss", price: "€ 19,90", img: "assets/img/sere1.jpg", link: "prodotto1.html" },
  { name: "Mascara", price: "€ 29,90", img: "assets/img/sere2.jpg", link: "prodotto2.html" },
  { name: "Fondotinta", price: "€ 49,90", img: "assets/img/sere3.jpg", link: "prodotto3.html" },
  { name: "Blush liquido", price: "€ 25,90", img: "assets/img/sere4.jpg", link: "prodotto4.html" },
  { name: "Matita sopracciglia", price: "€ 13,90", img: "assets/img/sere5.jpg", link: "prodotto5.html" },
  { name: "Gel sopracciglia", price: "€ 12,90", img: "assets/img/sere6.jpg", link: "prodotto6.html" },
  { name: "Palette occhi", price: "€ 59,90", img: "assets/img/sere7.jpg", link: "prodotto7.html" },
  { name: "Illuminante", price: "€ 29,90", img: "assets/img/sere8.jpg", link: "prodotto8.html" }
];

// Recupera parametro ?q= dalla URL
const params = new URLSearchParams(window.location.search);
const query = params.get("q") ? params.get("q").toLowerCase() : "";

// Mostra testo della ricerca
document.getElementById("search-query").textContent = query ? `Hai cercato: "${query}"` : "Mostro tutti i prodotti.";

// Filtra prodotti
const results = query
  ? products.filter(p => p.name.toLowerCase().includes(query))
  : products;

// Mostra i risultati
const container = document.getElementById("products-container");
if (results.length === 0) {
  container.innerHTML = "<p>Nessun prodotto trovato.</p>";
} else {
  results.forEach(p => {
    container.innerHTML += `
      <div class="col-md-4">
        <div class="card card-product">
          <img src="${p.img}" class="card-img-top" alt="${p.name}" loading="lazy">
          <div class="card-body">
            <h3 class="h6">${p.name}</h3>
            <p class="text-muted">${p.price}</p>
            <a class="btn btn-outline-pink btn-sm" href="${p.link}">Dettagli</a>
          </div>
        </div>
      </div>`;
  });
}
</script>

</body>
</html>
