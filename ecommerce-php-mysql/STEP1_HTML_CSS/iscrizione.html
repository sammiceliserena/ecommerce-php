<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iscrizione – SereCosmetics❀</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    crossorigin="anonymous">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    body { padding-top: 72px; }
    .nav-link.emoji-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      background-color: rgba(128, 128, 128, 0.2);
      color: black;
      transition: background-color 0.2s ease-in-out;
      margin: 0 10px;
    }
    .nav-link.emoji-icon:hover {
      background-color: rgba(128, 128, 128, 0.4);
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">SereCosmetics❀</a>
    <div class="collapse navbar-collapse show" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link emoji-icon" href="index.html" title="Home">🏠</a></li>
        <li class="nav-item"><a class="nav-link emoji-icon" href="login.html" title="Login">👤</a></li>
        <li class="nav-item"><a class="nav-link emoji-icon" href="carrello.html" title="Carrello">🛒</a></li>
        <li class="nav-item"><a class="nav-link emoji-icon" href="cronologia-ordini.html" title="Ordini">📦</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenuto -->
<main class="container my-5">
  <h1 class="h4 mb-3">Iscrizione</h1>

  <!-- Form che va a index.html -->
  <form method="get" class="row g-3" action="index.html">
    <div class="col-md-6">
      <label class="form-label">Nome</label>
      <input name="nome" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Cognome</label>
      <input name="cognome" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" minlength="6" required>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-pink">Crea account</button>
    </div>
  </form>

  <p class="mt-3">
    Hai già un account?
    <a href="login.html" class="btn btn-outline-pink btn-sm ms-2">Accedi</a>
  </p>
</main>

<!-- Footer -->
<footer class="mt-5 py-4 bg-dark text-light text-center">
  <div class="container">© 2025 SereCosmetics❀</div>
</footer>

</body>
</html>
